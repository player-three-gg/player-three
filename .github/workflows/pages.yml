# playerthree.gg: build the site (docs/, spec/, the TypeDoc API reference) and publish it with GitHub Pages.
# Repository settings: Pages → Source: GitHub Actions; custom domain playerthree.gg (site/public/CNAME ships it too).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
      # API reference → prerendered pages + 404.html → Pagefind index → internal link check (fails the job).
      - run: pnpm site:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
